name: radiopx
description: Aplicativo mobile que simula um sistema de rádio PX para comunicação por voz em tempo real.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  geolocator: ^10.1.0
  google_fonts: ^6.1.0
  provider: ^6.1.1
  just_audio: ^0.9.36
  path_provider: ^2.1.2
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
